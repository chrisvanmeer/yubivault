version: "2"

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - bodyclose
    - errorlint
    - misspell
    - nilerr
  settings:
    errcheck:
      check-type-assertions: true
      check-blank: false
  exclusions:
    generated: lax
    paths:
      - node_modules

formatters:
  enable:
    - gofmt
    - goimports
